<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI API Anomaly Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI API Anomaly Detection</h1>
    <form id="apiForm">
      <label for="traffic">API Traffic:</label>
      <input type="number" id="traffic" name="traffic" placeholder="Enter traffic value" required>
      <button type="submit">Check Anomaly</button>
    </form>
    <div id="result"></div>
    <h2>Logs</h2>
    <div id="logs" class="logs-container"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
